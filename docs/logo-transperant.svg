<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Reactor Summary</title>
  <desc>A rounded square with four build-status rows: success, up-to-date, skipped and failed.</desc>
  <style>
    .frame { stroke: #2C2C2A; }
    .dots { stroke: #888780; }
    @media (prefers-color-scheme: dark) {
      .frame { stroke: #F1EFE8; }
      .dots { stroke: #B4B2A9; }
    }
  </style>

  <rect class="frame" x="4" y="4" width="120" height="120" rx="14" fill="none" stroke-width="4"/>

  <circle cx="26" cy="32" r="5" fill="#1D9E75"/>
  <line class="dots" x1="38" y1="32" x2="86" y2="32" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round"/>
  <rect x="92" y="29" width="14" height="6" rx="2" fill="#1D9E75"/>

  <circle cx="26" cy="53" r="5" fill="#378ADD"/>
  <line class="dots" x1="38" y1="53" x2="86" y2="53" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round"/>
  <rect x="92" y="50" width="14" height="6" rx="2" fill="#378ADD"/>

  <circle cx="26" cy="74" r="5" fill="#EF9F27"/>
  <line class="dots" x1="38" y1="74" x2="86" y2="74" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round"/>
  <rect x="92" y="71" width="14" height="6" rx="2" fill="#EF9F27"/>

  <circle cx="26" cy="95" r="5" fill="#E24B4A"/>
  <line class="dots" x1="38" y1="95" x2="86" y2="95" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round"/>
  <rect x="92" y="92" width="14" height="6" rx="2" fill="#E24B4A"/>
</svg>
